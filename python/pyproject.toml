[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "slither-sim"
# Taken from python/Cargo.toml.
dynamic = ["version"]
description = "In-process slither-sim sessions for Python bots"
# Not README.md, which the sdist root takes from the workspace.
readme = "PYPI.md"
requires-python = ">=3.11"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Games/Entertainment :: Simulation",
]

[project.urls]
Repository = "https://github.com/NikitaMGrimm/slither-sim"
Documentation = "https://github.com/NikitaMGrimm/slither-sim/blob/main/docs/python.md"

[tool.maturin]
module-name = "slither_sim"
locked = true
# The sdist moves pyproject.toml to the workspace root, where builds from it
# look for the stub.
include = [{ path = "slither_sim.pyi", format = "sdist" }]
