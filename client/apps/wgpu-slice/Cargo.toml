[package]
name = "slither-wgpu-slice"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "MIT"

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "slither-wgpu-desktop"
path = "src/main.rs"

[[bin]]
name = "slither-wgpu-diagnostic"
path = "src/diagnostic_main.rs"

[[bin]]
name = "slither-client-e2e"
path = "src/e2e_main.rs"

[[example]]
name = "feel-replay"
path = "examples/feel_replay.rs"
required-features = ["feel-trace"]

[dependencies]
flate2 = "=1.1.10"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
slither-client = { path = "../.." }
url = "=2.5.8"
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "wgsl", "dx12", "vulkan", "webgpu"] }

[features]
feel-trace = ["slither-client/feel-trace"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
slither-protocol = { path = "../../../crates/slither-protocol" }
mio = { version = "=1.2.4", features = ["os-poll", "net"] }
pollster = "=0.4.0"
tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }
ureq = { version = "=3.5.0", default-features = false, features = ["rustls", "gzip"] }
scraper = { version = "=0.29.0", default-features = false }
rand = "=0.10.3"
png = "=0.18.1"
fontdue = { version = "=0.9.5", default-features = false, features = ["std"] }

[target.'cfg(windows)'.dependencies]
clipboard-win = "=5.4.3"
winsafe = { version = "=0.0.27", default-features = false, features = ["user"] }

# Linux has no enabled x11/wayland backend; the GPU-free probe does not need winit.
[target.'cfg(not(any(target_arch = "wasm32", target_os = "linux")))'.dependencies]
egui = { version = "=0.37.0", default-features = false }
egui-wgpu = { version = "=0.37.0", default-features = false }
egui-winit = { version = "=0.37.0", default-features = false }
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
js-sys = "=0.3.106"
web-sys = { version = "=0.3.106", features = ["Window", "Document", "HtmlElement", "Node", "Element", "DomRect", "HtmlCanvasElement", "OffscreenCanvas", "OffscreenCanvasRenderingContext2d", "TextMetrics", "ImageData"] }

[dev-dependencies]
png = "=0.18.1"
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }
