[package]
name = "slither-sim"
version.workspace = true
edition = "2024"
rust-version = "1.99"
description = "Headless Slither.io simulator for custom servers and bot development"
repository = "https://github.com/NikitaMGrimm/slither-sim"
readme = "README.md"
license = "MIT"
keywords = ["slither", "simulation", "bots", "headless"]
categories = ["simulation", "games"]
# Maintainer-only examples, guides, manifests and integration tests stay in Git.
# Unit tests in src/ read the listed fixtures with include_str!.
include = [
    "/build.rs",
    "/src",
    "/examples/basic.rs",
    "/examples/portable_bot.rs",
    "/examples/portable_bot.py",
    "/examples/forager.rs",
    # Every [[example]] below must ship its source: maturin's sdist keeps the
    # manifest's target list, and pip fails on a missing target file.
    "/examples/host_load.rs",
    "/examples/bot.py",
    "/examples/bot.mjs",
    "/examples/ffi_bot.py",
    "/tests/fixtures/forager-native-parity.json",
    "/tests/fixtures/forager-conformance.json",
    "/tests/fixtures/forager-oracle-windows-x86_64-msvc.json",
    "/tests/fixtures/forager-oracle-linux-x86_64-gnu.json",
    "/tests/fixtures/client-food-interest.json",
    "/tests/fixtures/client-hud-leaderboard.json",
    "/tests/fixtures/client-presentation.json",
    "/tests/fixtures/client-reporting-cadence.json",
    "/tests/fixtures/client-reporting-cadence-near-server.json",
    "/tests/fixtures/protocol-catalog-13.json",
    "/tests/fixtures/protocol-catalog-19.json",
    "/docs/*.md",
    # CHANGELOG.md links this guide.
    "/docs/maintainers/releasing.md",
    "/assets/logo.svg",
    "/README.md",
    "/CONTRIBUTING.md",
    "/LICENSE",
    "/CHANGELOG.md",
]
publish = ["crates-io"]

[workspace]
resolver = "3"
members = ["ffi", "python", "client", "client/apps/wgpu-slice"]
# Plain cargo commands at the root keep building and packaging only this crate.
default-members = ["."]

# One version for the simulator, the C ABI crate and the Python package;
# release-plz bumps it here.
[workspace.package]
version = "0.9.0"

[features]
default = ["networking", "parallel"]
bot = []
networking = ["bot", "dep:tungstenite"]
parallel = ["dep:rayon"]
# Benchmark harness only: hidden internals with no stability or semver promise.
perf-internals = ["networking"]

[[bin]]
name = "slither-sim"
path = "src/main.rs"
required-features = ["networking"]

[[example]]
name = "portable_bot"
required-features = ["networking"]

[[example]]
name = "forager"
required-features = ["bot"]

[[example]]
name = "host_load"
required-features = ["networking"]

[dependencies]
rayon = { version = "1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
serde_path_to_error = "0.1"
tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"], optional = true }

[dev-dependencies]
sha2 = "0.11"

[profile.release]
lto = "thin"
codegen-units = 1
