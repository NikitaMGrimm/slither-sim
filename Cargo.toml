[package]
name = "slither-sim"
version = "0.1.0"
edition = "2024"
rust-version = "1.86"
description = "Headless simulator inspired by Slither.io with portable protocol-19 bot inputs"
repository = "https://github.com/NikitaMGrimm/slither-sim"
readme = "README.md"
license = "MIT"
keywords = ["slither", "simulation", "bots", "headless"]
categories = ["simulation", "games"]
include = [
    "/src",
    "/examples/*.rs",
    "/examples/*.py",
    "/examples/*.mjs",
    "/tests",
    "/docs",
    "/assets/logo.svg",
    "/README.md",
    "/CONTRIBUTING.md",
    "/LICENSE",
    "/CHANGELOG.md",
]
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }

[profile.release]
lto = "thin"
codegen-units = 1
