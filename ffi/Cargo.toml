[package]
name = "slither-sim-ffi"
version.workspace = true
edition = "2024"
rust-version = "1.99"
description = "C ABI over slither-sim transport sessions (slither-sim-abi-v4)"
repository = "https://github.com/NikitaMGrimm/slither-sim"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
slither-sim = { path = "..", default-features = false, features = ["parallel"] }

[dev-dependencies]
serde_json = "1"
