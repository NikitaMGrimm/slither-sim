[workspace]
features_always_increment_minor = false
dependencies_update = false
semver_check = true
release_always = false
# Publication stays in release.yml, with CI, archive-identity and cooldown checks.
publish = false
git_tag_enable = false
git_release_enable = false
pr_name = "chore(release): prepare v{{ version }}"
pr_body = """
{% for release in releases %}
<!-- release-plz {{ release.package }} {{ release.previous_version }} {{ release.next_version }} {{ release.semver_check }} -->
Release `{{ release.package }}`: {{ release.previous_version }} -> {{ release.next_version }}.
Rust API check: **{{ release.semver_check }}**.
{% if release.breaking_changes %}
{{ release.breaking_changes }}
{% endif %}
{% if release.changelog %}
{{ release.changelog }}
{% endif %}
{% endfor %}
Compatible patch releases merge after required checks, at least 12 hours after the
previous publication. Other version bumps require maintainer review and merge.
JSON/CLI compatibility and physics evidence still need review in the original PRs.

Generated by [release-plz](https://release-plz.dev/) via GitHub Actions.
"""

[changelog]
header = "# Changelog\n\n## Unreleased\n"
protect_breaking_commits = true
