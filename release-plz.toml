[workspace]
features_always_increment_minor = false
dependencies_update = false
semver_check = true
release_always = false
# Publication stays in release.yml, with CI, archive-identity and cooldown checks.
publish = false
git_tag_enable = false
git_release_enable = false
pr_name = "chore(release): prepare v{{ version }}"
pr_body = """
{% for release in releases %}
<!-- release-plz {{ release.package }} {{ release.previous_version }} {{ release.next_version }} {{ release.semver_check }} -->
Release `{{ release.package }}`: {{ release.previous_version }} -> {{ release.next_version }}.
Rust API check: **{{ release.semver_check }}**.
{% if release.breaking_changes %}
{{ release.breaking_changes }}
{% endif %}
{% if release.changelog %}
{{ release.changelog }}
{% endif %}
{% endfor %}
Compatible patch releases merge automatically after required checks and the
12-hour wait. A maintainer's manual merge requests immediate publication and
starts a new 12-hour wait for the next automatic merge. Other version bumps
require maintainer review and merge.
JSON/CLI compatibility and physics evidence still need review in the original PRs.

Generated by [release-plz](https://release-plz.dev/) via GitHub Actions.
"""

# Neither goes to crates.io: the C ABI crate is unpublished and release.yml
# uploads the Python package to PyPI. Record their changes in the root changelog.
[[package]]
name = "slither-sim-ffi"
release = false

[[package]]
name = "slither-sim-py"
release = false

# The client crates share the workspace but are never released from here.
[[package]]
name = "slither-client"
release = false

[[package]]
name = "slither-wgpu-slice"
release = false

# The owner manually publishes 0.1.0 after A0 merges. Keep version bumps and
# publication disabled here; the simulator-switch PR will wire release.yml.
[[package]]
name = "slither-protocol"
release = false

[changelog]
header = "# Changelog\n\n## Unreleased\n"
protect_breaking_commits = true
# The changelog is curated by hand under Unreleased (CONTRIBUTING), so the
# version section adds only its heading above those entries. Generated commit
# titles would also list every client/ commit, which release-plz attributes to
# the root crate since the import (#283). Skipping every commit instead drops
# the heading too (#306). The default trim removes the blank lines around the
# heading (#309); without it, release-plz adds the one above (#311).
trim = false
body = """
## [{{ version }}]{%- if release_link -%}({{ release_link }}){% endif %} - {{ timestamp | date(format="%Y-%m-%d") }}
"""
