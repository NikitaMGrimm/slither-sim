name: Direct release performance
run-name: Release perf ${{ inputs.baseline_tag }} ${{ inputs.baseline_commit }} ${{ inputs.candidate_commit }}

on:
  workflow_dispatch:
    inputs:
      baseline_tag:
        description: Previous published version tag (vX.Y.Z)
        required: true
        type: string
      baseline_commit:
        description: Exact commit behind the published tag (40 lowercase hex)
        required: true
        type: string
      candidate_commit:
        description: Exact candidate commit, normally main or the rolling release PR head
        required: true
        type: string

permissions:
  contents: read

jobs:
  pin:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      key: ${{ steps.pin.outputs.key }}
      harness: ${{ steps.pin.outputs.harness }}
      baseline: ${{ steps.pin.outputs.baseline }}
      candidate: ${{ steps.pin.outputs.candidate }}
      duplicate: ${{ steps.pin.outputs.duplicate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: pin
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await require('./tools/release_perf_request.cjs').pin({github, context, core, filename:'request.json'});
      - if: steps.pin.outputs.duplicate != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-perf-request-${{ github.run_attempt }}
          path: request.json
          if-no-files-found: error
          retention-days: 14

  measure:
    needs: pin
    if: needs.pin.outputs.duplicate == 'false'
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    concurrency:
      group: release-perf-${{ needs.pin.outputs.key }}
      cancel-in-progress: false
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_RELEASE_OPT_LEVEL: 3
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 1
      CARGO_PROFILE_RELEASE_DEBUG: 'false'
      CARGO_PROFILE_RELEASE_INCREMENTAL: 'false'
      CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS: 'false'
      CARGO_PROFILE_RELEASE_PANIC: unwind
      CARGO_PROFILE_RELEASE_STRIP: none
      RUST_TEST_THREADS: 1
    steps:
      - name: Record job clock before setup or builds
        shell: pwsh
        run: |
          "RELEASE_PERF_JOB_START=$(python -c 'import time; print(repr(time.monotonic()))')" >> $env:GITHUB_ENV
          "CARGO_TARGET_DIR=$env:RUNNER_TEMP/release-perf-target" >> $env:GITHUB_ENV
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.pin.outputs.harness }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-perf-request-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-perf-request
      - name: Fetch the two exact runtime commits
        shell: bash
        env:
          BASELINE: ${{ needs.pin.outputs.baseline }}
          CANDIDATE: ${{ needs.pin.outputs.candidate }}
        run: git fetch --no-tags --depth=1 origin "$BASELINE" "$CANDIDATE"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Compare the pinned sources
        env:
          REQUEST: ${{ runner.temp }}/release-perf-request/request.json
          OUTPUT: ${{ runner.temp }}/release-perf
        shell: pwsh
        run: python -B tools/release_perf.py --request $env:REQUEST --output $env:OUTPUT
      - name: Upload bounded terminal report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-perf-report-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/release-perf/report.json
            ${{ runner.temp }}/release-perf/report.md
          if-no-files-found: error
          retention-days: 14
      - name: Preserve raw and failed attempts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-perf-evidence-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-perf
          if-no-files-found: warn
          retention-days: 14
