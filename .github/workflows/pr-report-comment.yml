name: PR comparison comment

on:
  workflow_run:
    workflows: [PR comparison]
    types: [in_progress, completed]

permissions: {}

jobs:
  comment:
    name: Update PR comment
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 33
    permissions:
      contents: read
      actions: read
      pull-requests: write
    concurrency:
      group: pr-report-comment-${{ github.event.workflow_run.head_repository.id }}-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    steps:
      # workflow_run uses the default branch. Never check out or execute PR code
      # in this job: downloaded reports are untrusted data, including for forks.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Publish bounded checkpoint and terminal updates
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { observe } = require('./tools/pr_report_comment.cjs');
            await observe({github, context, core});
  release_summary:
    name: Refresh release evidence
    needs: [comment]
    if: always() && github.event.workflow_run.status == 'completed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: release-performance-summary
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Refresh release evidence
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { summarize } = require('./tools/release_performance.cjs');
            await summarize({github, context, core});
