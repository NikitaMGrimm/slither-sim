name: PR comparison comment

on:
  workflow_run:
    workflows: [PR comparison]
    types: [completed]

permissions: {}

jobs:
  comment:
    name: Update PR comment
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
      pull-requests: write
    concurrency:
      group: pr-report-comment-${{ github.event.workflow_run.head_repository.id }}-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    steps:
      # workflow_run uses the default branch. Never check out or execute PR code
      # in this job: downloaded reports are untrusted data, including for forks.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate source run and select its artifact
        id: source
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { prepare } = require('./tools/pr_report_comment.cjs');
            await prepare({github, context, core});
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.source.outputs.artifact_id }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/pr-report-data
      - name: Publish current comparison
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REPORT_DIRECTORY: ${{ runner.temp }}/pr-report-data
        with:
          script: |
            const publish = require('./tools/pr_report_comment.cjs');
            await publish({github, context, core, directory: process.env.REPORT_DIRECTORY});
