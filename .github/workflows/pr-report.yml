name: PR comparison

on:
  # Drafts are measured, so ready_for_review would repeat the same head.
  pull_request:
    types: [opened, synchronize, reopened]
    # Inputs that can change a measured binary, test or fixture result, or the
    # collector itself. GitHub matches the whole PR diff, so once a PR touches
    # one of these every later push is measured. Other PRs create no run, so the
    # publisher never sees them. tools/test_pr_report.py checks this list.
    paths:
      - src/**
      - Cargo.toml
      - Cargo.lock
      - build.rs
      - .cargo/**
      - rust-toolchain
      - rust-toolchain.toml
      - examples/perf_baseline.rs
      - examples/fidelity_metrics.rs
      - tests/movement_turns.rs
      - tests/physics.rs
      - tests/fixtures/**
      - tools/pr_report.py
      - tools/perf_baseline.py
      - tools/perf_compare.py
      - tools/perf_build.py
      - tools/perf_stats.py
      - .github/workflows/pr-report.yml
  # Main runs only refresh the dependency cache that PR runs restore. PR runs never
  # save it, so one PR's build cannot reach another PR's measurement.
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-report-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  # Hosted runners have 4 vCPUs; every build finishes before timing starts.
  CARGO_BUILD_JOBS: 4
  # Only the regression tests use the dev profile; measured binaries are release.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  measure:
    name: Measurements
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    # tools/pr_report.py derives the sampling deadline from this limit
    # (JOB_TIMEOUT_SECONDS) and keeps 60 seconds for the report and uploads.
    timeout-minutes: 15
    steps:
      - name: Record job start
        shell: python
        run: |
          import os, time
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as environment:
              environment.write(f"PR_REPORT_JOB_START={time.monotonic()!r}\n")
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      # Dependencies only: the cache drops workspace packages, and both revisions'
      # simulator packages are rebuilt from source after a clean.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: pr-report
          save-if: false
      - name: Compare target and proposed merge
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          REPORT_DIRECTORY: ${{ runner.temp }}/pr-report
        run: python tools/pr_report.py --output "$env:REPORT_DIRECTORY" --head "$env:PR_HEAD"
      # The small comment artifact goes first so a slow full upload cannot cost the comment.
      - name: Upload comment data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-report-comment
          path: |
            ${{ runner.temp }}/pr-report/report.json
            ${{ runner.temp }}/pr-report/report.md
          if-no-files-found: error
          retention-days: 14
          overwrite: true
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-report
          path: ${{ runner.temp }}/pr-report
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  cache:
    name: Dependency cache
    # TEMPORARY: also save a PR-scope cache to measure a cache hit on the next push.
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        id: cache
        with:
          shared-key: pr-report
          lookup-only: true
      # An exact hit means the lockfile, toolchain and environment are unchanged.
      - name: Build release dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: cargo build --release --locked --example perf_baseline --example fidelity_metrics
      - name: Build test dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: cargo test --locked --no-run --test movement_turns --test physics
