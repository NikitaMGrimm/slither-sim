name: PR comparison

on:
  # Drafts are measured, so ready_for_review would repeat the same head.
  pull_request:
    types: [opened, synchronize, reopened]
    # Inputs that can change a measured binary, test or fixture result, or the
    # collector itself. GitHub matches the whole PR diff, so once a PR touches
    # one of these every later push is measured. Other PRs create no run, so the
    # publisher never sees them. tools/test_pr_report.py checks this list.
    paths:
      - src/**
      - Cargo.toml
      - Cargo.lock
      - build.rs
      - .cargo/**
      - rust-toolchain
      - rust-toolchain.toml
      - examples/perf_baseline.rs
      - examples/host_load.rs
      - examples/perf_observation.rs
      - examples/perf_client_retained.rs
      - examples/support/state.rs
      - examples/support/runtime.rs
      - examples/perf_session.rs
      - examples/perf_radius.rs
      - examples/fidelity_metrics.rs
      - tests/movement_turns.rs
      - tests/physics.rs
      - tests/support/mod.rs
      - tests/fixtures/**
      - tools/pr_report.py
      - tools/perf_report_probe.py
      - tools/perf_baseline.py
      - tools/perf_compare.py
      - tools/perf_build.py
      - tools/perf_stats.py
      - tools/pr_report_progress.py
      - .github/workflows/pr-report.yml
  # Main runs only refresh the dependency cache that PR runs restore. PR runs never
  # save it, so one PR's build cannot reach another PR's measurement.
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-report-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  # Hosted runners have 4 vCPUs; every build finishes before timing starts.
  CARGO_BUILD_JOBS: 4
  # Only the regression tests use the dev profile; measured binaries are release.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  measure:
    name: Measurements
    if: github.event_name == 'pull_request'
    # The comparison's runner, set only here; the cache job reuses it because the
    # cache key includes the OS. Ubuntu was the quieter, faster runner in the
    # calibration pilot (docs/maintainers/pr-reports.md#calibration).
    runs-on: &runner ubuntu-latest
    # Provisional operational cap; includes checkpoint pauses. Keep 90 seconds
    # for report finalization and uploads (tools/pr_report.py).
    timeout-minutes: 30
    steps:
      - name: Record job start
        shell: bash
        run: |
          python=python3; if [ "$RUNNER_OS" = Windows ]; then python=python; fi
          echo "PYTHON=$python" >> "$GITHUB_ENV"
          echo "PR_REPORT_JOB_START=$("$python" -c 'import time; print(repr(time.monotonic()))')" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      # Dependencies only: the cache drops workspace packages, and both revisions'
      # simulator packages are rebuilt from source after a clean.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: pr-report
          save-if: false
      - name: Start target and proposed merge comparison
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          REPORT_DIRECTORY: ${{ runner.temp }}/pr-report
        shell: bash
        run: '"$PYTHON" tools/pr_report_progress.py start --output "$REPORT_DIRECTORY" --head "$PR_HEAD"'
      # Upload only while the collector is paused between covered rounds. The
      # next wait acknowledges the preceding upload before timing can resume.
      - name: Wait for first checkpoint
        id: progress1
        shell: bash
        run: '"$PYTHON" tools/pr_report_progress.py wait --output "${{ runner.temp }}/pr-report" --sequence 1'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.progress1.outputs.ready == 'true'
        with:
          name: pr-report-progress-${{ github.run_attempt }}-1
          path: |
            ${{ runner.temp }}/pr-report/progress/1/report.json
            ${{ runner.temp }}/pr-report/progress/1/report.md
          if-no-files-found: error
          retention-days: 14
      - name: Wait for second checkpoint
        id: progress2
        shell: bash
        run: '"$PYTHON" tools/pr_report_progress.py wait --output "${{ runner.temp }}/pr-report" --sequence 2'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.progress2.outputs.ready == 'true'
        with:
          name: pr-report-progress-${{ github.run_attempt }}-2
          path: |
            ${{ runner.temp }}/pr-report/progress/2/report.json
            ${{ runner.temp }}/pr-report/progress/2/report.md
          if-no-files-found: error
          retention-days: 14
      - name: Wait for third checkpoint
        id: progress3
        shell: bash
        run: '"$PYTHON" tools/pr_report_progress.py wait --output "${{ runner.temp }}/pr-report" --sequence 3'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.progress3.outputs.ready == 'true'
        with:
          name: pr-report-progress-${{ github.run_attempt }}-3
          path: |
            ${{ runner.temp }}/pr-report/progress/3/report.json
            ${{ runner.temp }}/pr-report/progress/3/report.md
          if-no-files-found: error
          retention-days: 14
      - name: Finish comparison
        shell: bash
        run: '"$PYTHON" tools/pr_report_progress.py finish --output "${{ runner.temp }}/pr-report"'
      - name: Stop and reap collector before uploads
        id: cleanup
        if: always()
        timeout-minutes: 2
        shell: bash
        run: '"$PYTHON" tools/pr_report_progress.py cleanup --output "${{ runner.temp }}/pr-report"'
      # The small comment artifact goes first so a slow full upload cannot cost the comment.
      - name: Upload comment data
        if: success() && steps.cleanup.outputs.safe_to_upload == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-report-comment-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/pr-report/report.json
            ${{ runner.temp }}/pr-report/report.md
          if-no-files-found: error
          retention-days: 14
      - name: Upload results
        if: always() && steps.cleanup.outputs.safe_to_upload == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-report-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/pr-report
            ${{ runner.temp }}/pr-report.collector.log
            ${{ runner.temp }}/pr-report.pid
            ${{ runner.temp }}/pr-report.control
          if-no-files-found: error
          retention-days: 14

  cache:
    name: Dependency cache
    if: github.event_name == 'push'
    runs-on: *runner
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        id: cache
        with:
          shared-key: pr-report
          lookup-only: true
      # An exact hit means the lockfile, toolchain and environment are unchanged.
      - name: Build release dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: cargo build --release --locked --example perf_baseline --example fidelity_metrics
      - name: Build test dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: cargo test --locked --no-run --test movement_turns --test physics
