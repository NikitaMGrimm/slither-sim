name: PR comparison

on:
  # Drafts are measured, so ready_for_review would repeat the same head.
  pull_request:
    types: [opened, synchronize, reopened]
    # Inputs that can change a measured binary, test or fixture result, or the
    # collector itself. GitHub matches the whole PR diff, so once a PR touches
    # one of these every later push is measured. Other PRs create no run, so the
    # publisher never sees them. tools/test_pr_report.py checks this list.
    paths:
      - src/**
      - Cargo.toml
      - Cargo.lock
      - build.rs
      - .cargo/**
      - rust-toolchain
      - rust-toolchain.toml
      - examples/perf_baseline.rs
      - examples/fidelity_metrics.rs
      - tests/movement_turns.rs
      - tests/physics.rs
      - tests/fixtures/**
      - tools/pr_report.py
      - tools/perf_baseline.py
      - tools/perf_compare.py
      - tools/perf_build.py
      - .github/workflows/pr-report.yml

permissions:
  contents: read

concurrency:
  group: pr-report-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  measure:
    name: Measurements
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - name: Compare target and proposed merge
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          REPORT_DIRECTORY: ${{ runner.temp }}/pr-report
        run: python tools/pr_report.py --output "$env:REPORT_DIRECTORY" --head "$env:PR_HEAD"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-report
          path: ${{ runner.temp }}/pr-report
          if-no-files-found: error
          retention-days: 14
          overwrite: true
      - name: Upload comment data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-report-comment
          path: |
            ${{ runner.temp }}/pr-report/report.json
            ${{ runner.temp }}/pr-report/report.md
          if-no-files-found: error
          retention-days: 14
          overwrite: true
