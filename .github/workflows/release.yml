name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: 2

jobs:
  release:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Require a main commit with successful CI
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 tools/release.py --check-ci
      - name: Check tag and published identity
        if: github.event_name == 'push'
        id: package
        run: python3 tools/release.py "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
      - name: Verify package
        if: github.event_name == 'push' && steps.package.outputs.already_published != 'true'
        run: cargo publish --locked --dry-run --registry crates-io
      - name: Authenticate with crates.io
        if: github.event_name == 'workflow_dispatch' || steps.package.outputs.already_published != 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish crate
        if: github.event_name == 'push' && steps.package.outputs.already_published != 'true'
        run: cargo publish --locked --registry crates-io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - name: Create GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRERELEASE: ${{ steps.package.outputs.prerelease }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            args=(--verify-tag --title "$GITHUB_REF_NAME" --generate-notes)
            if [[ "$PRERELEASE" == 'true' ]]; then args+=(--prerelease); fi
            gh release create "$GITHUB_REF_NAME" "${args[@]}"
          fi
      - name: Confirm connection
        if: github.event_name == 'workflow_dispatch'
        run: echo 'Trusted publishing authenticated successfully. No crate or release was published.'
