name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['Cargo.toml', 'Cargo.lock', 'CHANGELOG.md']
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'auto to reconcile, vVERSION to retry a release, or empty to test authentication'
        required: false
        default: ''

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: 2

jobs:
  release:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: write
      pull-requests: write
      id-token: write
    outputs:
      commit: ${{ steps.target.outputs.commit }}
      ready: ${{ steps.cooldown.outputs.ready }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Select a release or finish an interrupted publication
        id: target
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 tools/release_automation.py select >> "$GITHUB_OUTPUT"
      - name: Check out the selected source separately from the automation
        if: steps.target.outputs.tag != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.target.outputs.commit }}
          path: release-source
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: steps.target.outputs.tag != ''
      - name: Require a main commit with successful CI
        if: steps.target.outputs.tag != ''
        env:
          RELEASE_COMMIT: ${{ steps.target.outputs.commit }}
          RELEASE_TAG: ${{ steps.target.outputs.tag }}
        run: python3 tools/release.py --check-ci --commit "$RELEASE_COMMIT" --ci-ref "$RELEASE_TAG"
      - name: Check tag and published identity
        if: steps.target.outputs.tag != ''
        id: package
        env:
          RELEASE_COMMIT: ${{ steps.target.outputs.commit }}
          RELEASE_TAG: ${{ steps.target.outputs.tag }}
        run: python3 tools/release.py "$RELEASE_TAG" --commit "$RELEASE_COMMIT" >> "$GITHUB_OUTPUT"
      - name: Verify package
        if: steps.target.outputs.tag != '' && steps.package.outputs.already_published != 'true'
        working-directory: release-source
        run: cargo publish --locked --dry-run --registry crates-io
      - name: Check publication cooldown or maintainer release merge
        if: steps.target.outputs.tag != ''
        id: cooldown
        env:
          RELEASE_COMMIT: ${{ steps.target.outputs.commit }}
          RELEASE_TAG: ${{ steps.target.outputs.tag }}
        run: python3 tools/release_automation.py publication-ready >> "$GITHUB_OUTPUT"
      - name: Authenticate with crates.io
        if: (github.event_name == 'workflow_dispatch' && inputs.tag == '') || (steps.cooldown.outputs.ready == 'true' && steps.cooldown.outputs.already_published != 'true')
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish crate
        if: steps.cooldown.outputs.ready == 'true' && steps.cooldown.outputs.already_published != 'true'
        working-directory: release-source
        run: cargo publish --locked --registry crates-io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - name: Create GitHub Release
        if: steps.cooldown.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRERELEASE: ${{ steps.package.outputs.prerelease }}
          RELEASE_TAG: ${{ steps.target.outputs.tag }}
        run: |
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft); then
            if [[ "$draft" == 'true' ]]; then
              gh release edit "$RELEASE_TAG" --draft=false --prerelease="$PRERELEASE"
            fi
          else
            args=(--verify-tag --title "$RELEASE_TAG" --generate-notes)
            if [[ "$PRERELEASE" == 'true' ]]; then args+=(--prerelease); fi
            gh release create "$RELEASE_TAG" "${args[@]}"
          fi
      - name: Refresh release preparation after publication
        if: steps.cooldown.outputs.ready == 'true'
        run: gh workflow run release-pr.yml --ref main
      - name: Confirm connection
        if: github.event_name == 'workflow_dispatch' && inputs.tag == ''
        run: echo 'Trusted publishing authenticated successfully. No crate or release was published.'

  # The Python package shares the crate's version and follows its publication.
  # It is not part of release completion: a failure leaves the crate release
  # done, and dispatching vVERSION rebuilds and uploads only missing files.
  python-dist:
    needs: release
    if: needs.release.outputs.ready == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/python-wheels.yml
    with:
      ref: ${{ needs.release.outputs.commit }}

  pypi:
    name: Publish Python package
    needs: python-dist
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # PyPI's trusted publisher names this workflow and environment.
    environment:
      name: pypi
      url: https://pypi.org/project/slither-sim/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: python-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true
