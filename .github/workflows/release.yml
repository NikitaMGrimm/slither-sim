name: Release

on:
  push:
    branches: [main]
    tags: ['v*', 'slither-protocol-v*']
    paths: ['Cargo.toml', 'Cargo.lock', 'CHANGELOG.md', 'crates/slither-protocol/Cargo.toml', 'crates/slither-protocol/CHANGELOG.md']
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'auto to reconcile, vVERSION to retry a release, or empty to test authentication'
        required: false
        default: ''

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: 2

jobs:
  release:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: write
      pull-requests: write
      id-token: write
    outputs:
      commit: ${{ steps.target.outputs.commit }}
      tag: ${{ steps.target.outputs.tag }}
      ready: ${{ steps.cooldown.outputs.ready }}
      package: ${{ steps.target.outputs.package }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Select a release or finish an interrupted publication
        id: target
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 tools/release_automation.py select >> "$GITHUB_OUTPUT"
      - name: Check out the selected source separately from the automation
        if: steps.target.outputs.tag != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.target.outputs.commit }}
          path: release-source
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: steps.target.outputs.tag != ''
      - name: Require a main commit with successful CI
        if: steps.target.outputs.tag != ''
        env:
          RELEASE_COMMIT: ${{ steps.target.outputs.commit }}
          RELEASE_TAG: ${{ steps.target.outputs.tag }}
        run: python3 tools/release.py --check-ci --commit "$RELEASE_COMMIT" --ci-ref "$RELEASE_TAG"
      - name: Check tag and published identity
        if: steps.target.outputs.tag != ''
        id: package
        env:
          RELEASE_COMMIT: ${{ steps.target.outputs.commit }}
          RELEASE_TAG: ${{ steps.target.outputs.tag }}
          RELEASE_PACKAGE: ${{ steps.target.outputs.package }}
        run: python3 tools/release.py "$RELEASE_TAG" --commit "$RELEASE_COMMIT" >> "$GITHUB_OUTPUT"
      - name: Check publication cooldown or maintainer release merge
        if: steps.target.outputs.tag != ''
        id: cooldown
        env:
          RELEASE_COMMIT: ${{ steps.target.outputs.commit }}
          RELEASE_TAG: ${{ steps.target.outputs.tag }}
          RELEASE_PACKAGE: ${{ steps.target.outputs.package }}
        run: python3 tools/release_automation.py publication-ready >> "$GITHUB_OUTPUT"
      - name: Verify protocol before a prerequisite upload
        if: steps.cooldown.outputs.ready == 'true' && steps.cooldown.outputs.protocol_needed == 'true'
        working-directory: release-source
        run: cargo publish --locked --dry-run -p slither-protocol --registry crates-io
      - name: Authenticate with crates.io
        if: (github.event_name == 'workflow_dispatch' && inputs.tag == '') || (steps.cooldown.outputs.ready == 'true' && steps.cooldown.outputs.already_published != 'true')
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Explain protocol authentication failure
        if: failure() && steps.auth.outcome == 'failure' && (steps.cooldown.outputs.protocol_needed == 'true' || steps.target.outputs.package == 'slither-protocol')
        run: |
          echo '::error::slither-protocol publication requires crates.io Trusted Publisher authentication for NikitaMGrimm/slither-sim, release.yml, no environment. Authentication failed; no fallback token or simulator upload is allowed.'
          exit 1
      - name: Publish protocol prerequisite
        if: steps.cooldown.outputs.ready == 'true' && steps.cooldown.outputs.protocol_needed == 'true'
        working-directory: release-source
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          cargo publish --locked -p slither-protocol --registry crates-io || {
            echo '::error::slither-protocol upload failed. Check its registered Trusted Publisher and registry response; simulator publication is blocked.'
            exit 1
          }
      - name: Wait for the protocol registry dependency
        if: steps.cooldown.outputs.ready == 'true' && steps.target.outputs.package == 'slither-sim'
        env:
          RELEASE_COMMIT: ${{ steps.target.outputs.commit }}
        run: |
          if git cat-file -e "$RELEASE_COMMIT:crates/slither-protocol/Cargo.toml" 2>/dev/null; then
            python3 tools/release_automation.py wait-protocol
          fi
      - name: Verify selected package against registry dependencies
        if: steps.cooldown.outputs.ready == 'true' && steps.cooldown.outputs.already_published != 'true'
        working-directory: release-source
        env:
          RELEASE_PACKAGE: ${{ steps.target.outputs.package }}
        run: cargo publish --locked --dry-run -p "$RELEASE_PACKAGE" --registry crates-io
      - name: Publish crate
        if: steps.cooldown.outputs.ready == 'true' && steps.cooldown.outputs.already_published != 'true'
        working-directory: release-source
        run: cargo publish --locked -p "$RELEASE_PACKAGE" --registry crates-io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          RELEASE_PACKAGE: ${{ steps.target.outputs.package }}
      - name: Confirm independent protocol publication
        if: steps.cooldown.outputs.ready == 'true' && steps.target.outputs.package == 'slither-protocol'
        env:
          RELEASE_COMMIT: ${{ steps.target.outputs.commit }}
        run: python3 tools/release_automation.py wait-protocol
      - name: Create GitHub Release
        if: steps.cooldown.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRERELEASE: ${{ steps.package.outputs.prerelease }}
          RELEASE_TAG: ${{ steps.target.outputs.tag }}
        run: |
          # Only simulator releases may become the repository's Latest release;
          # slither-protocol-v0.1.1 displaced v0.9.0 on 2026-11-01.
          latest=true
          if [[ "$RELEASE_TAG" == slither-protocol-* ]]; then latest=false; fi
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft); then
            if [[ "$draft" == 'true' ]]; then
              gh release edit "$RELEASE_TAG" --draft=false --prerelease="$PRERELEASE" --latest="$latest"
            fi
          else
            args=(--verify-tag --title "$RELEASE_TAG" --generate-notes --latest="$latest")
            if [[ "$PRERELEASE" == 'true' ]]; then args+=(--prerelease); fi
            gh release create "$RELEASE_TAG" "${args[@]}"
          fi
      - name: Refresh release preparation after publication
        if: steps.cooldown.outputs.ready == 'true'
        run: gh workflow run release-pr.yml --ref main
      - name: Confirm connection
        if: github.event_name == 'workflow_dispatch' && inputs.tag == ''
        run: echo 'Trusted publishing authenticated successfully. No crate or release was published.'

  # The Python package shares the crate's version and follows its publication.
  # It is not part of release completion: a failure leaves the crate release
  # done, and dispatching vVERSION rebuilds and uploads only missing files.
  python-dist:
    needs: release
    if: needs.release.outputs.ready == 'true' && needs.release.outputs.package == 'slither-sim'
    permissions:
      contents: read
    uses: ./.github/workflows/python-wheels.yml
    with:
      ref: ${{ needs.release.outputs.commit }}

  pypi:
    name: Publish Python package
    needs: python-dist
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # PyPI's trusted publisher names this workflow and environment.
    environment:
      name: pypi
      url: https://pypi.org/project/slither-sim/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: python-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true

  # Prebuilt CLI and C ABI archives follow the same rules as the Python package:
  # a failure leaves the crate release done, and dispatching vVERSION rebuilds
  # every archive and replaces the uploaded set, checksums included.
  binaries:
    needs: release
    if: needs.release.outputs.ready == 'true' && needs.release.outputs.package == 'slither-sim'
    permissions:
      contents: read
    uses: ./.github/workflows/release-binaries.yml
    with:
      ref: ${{ needs.release.outputs.commit }}

  release-assets:
    name: Upload release binaries
    needs: [release, binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binaries-*
          path: assets
          merge-multiple: true
      - name: Upload to the GitHub Release
        working-directory: assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
          # Clobbering is per file, so remove the old checksums before replacing
          # any archive and upload the new ones last: an interrupted upload then
          # leaves no SHA256SUMS rather than one that describes a mixed set.
          assets=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
          if grep -qx SHA256SUMS <<< "$assets"; then
            gh release delete-asset "$RELEASE_TAG" SHA256SUMS --yes
          fi
          gh release upload "$RELEASE_TAG" slither-sim-* --clobber
          gh release upload "$RELEASE_TAG" SHA256SUMS --clobber
