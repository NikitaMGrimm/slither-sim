name: Client

# Called by checks.yml when client/ changes; the caller owns concurrency and the
# required-check aggregation. The repository guard runs there for every change.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2

defaults:
  run:
    working-directory: client

jobs:
  node:
    name: Node tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --test tools/*.test.mjs
      - name: Test shared gameplay socket adapter offline
        run: node --test --test-concurrency=1 apps/wgpu-slice/tests/*.test.mjs

  native:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v0-client
          workspaces: |
            client -> target
            ${{ matrix.os == 'windows-latest' && 'client/apps/wgpu-slice -> ../../target/wgpu-slice-ci' || '' }}
          # The Windows wgpu target can exceed the shared cache budget.
          cache-targets: ${{ matrix.os != 'windows-latest' }}
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo test --all-targets --locked
      - run: cargo test --doc --locked
      - run: cargo clippy --all-targets --locked -- -D warnings
      - name: Format shared wgpu slice
        if: matrix.os == 'windows-latest'
        run: cargo fmt --manifest-path apps/wgpu-slice/Cargo.toml --check
      - name: Test shared wgpu slice offline
        if: matrix.os == 'windows-latest'
        env:
          CARGO_BUILD_JOBS: 1
          CARGO_TARGET_DIR: target/wgpu-slice-ci
          RUST_TEST_THREADS: 1
        run: cargo test --manifest-path apps/wgpu-slice/Cargo.toml --locked --lib --tests
      - name: Check shared wgpu Windows host
        if: matrix.os == 'windows-latest'
        env:
          CARGO_BUILD_JOBS: 1
          CARGO_TARGET_DIR: target/wgpu-slice-ci
        run: cargo clippy --manifest-path apps/wgpu-slice/Cargo.toml --locked --all-targets -- -D warnings
      - name: Build shared wgpu Windows executable
        if: matrix.os == 'windows-latest'
        env:
          CARGO_BUILD_JOBS: 1
          CARGO_TARGET_DIR: target/wgpu-slice-ci
        run: cargo build --manifest-path apps/wgpu-slice/Cargo.toml --locked --bin slither-wgpu-desktop

  wasm:
    name: WebAssembly build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Keep target trees disjoint so cleanup uses each manifest's dependencies.
      CARGO_TARGET_DIR: target/client-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust and target
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v0-client
          workspaces: |
            client -> target/client-ci
            client/apps/wgpu-slice -> ../../target/wgpu-slice-ci
          cache-targets: true
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install verified binding CLI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/wasm-bindgen/gh-release"
          gh release download 0.2.129 --repo wasm-bindgen/wasm-bindgen --pattern 'wasm-bindgen-0.2.129-x86_64-unknown-linux-musl.tar.gz*' --dir "$RUNNER_TEMP/wasm-bindgen/gh-release"
          cd "$RUNNER_TEMP/wasm-bindgen"
          sha256sum -c gh-release/wasm-bindgen-0.2.129-x86_64-unknown-linux-musl.tar.gz.sha256sum
          tar -xzf gh-release/wasm-bindgen-0.2.129-x86_64-unknown-linux-musl.tar.gz
          echo "WASM_BINDGEN=$RUNNER_TEMP/wasm-bindgen/wasm-bindgen-0.2.129-x86_64-unknown-linux-musl/wasm-bindgen" >> "$GITHUB_ENV"
      - run: npm run build:web
      - run: node tools/wasm-smoke.mjs
      - name: Check shared wgpu WebAssembly host
        env:
          CARGO_BUILD_JOBS: 1
          CARGO_TARGET_DIR: target/wgpu-slice-ci
        run: cargo clippy --manifest-path apps/wgpu-slice/Cargo.toml --locked --lib --target wasm32-unknown-unknown -- -D warnings
      - name: Build shared wgpu WebAssembly host
        env:
          CARGO_BUILD_JOBS: 1
          CARGO_TARGET_DIR: target/wgpu-slice-ci
        run: cargo build --manifest-path apps/wgpu-slice/Cargo.toml --locked --lib --target wasm32-unknown-unknown
      - name: Generate shared wgpu web bindings
        shell: bash
        run: '"$WASM_BINDGEN" --target web --out-dir dist/wgpu-slice-ci/pkg --out-name slither_wgpu_slice target/wgpu-slice-ci/wasm32-unknown-unknown/debug/slither_wgpu_slice.wasm'
