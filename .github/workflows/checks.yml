name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push cancels its PR's older run. Main and dispatched runs each get their
# own group and always finish: publication waits for the run of its exact commit,
# and main runs save the Rust caches that PRs restore.
concurrency:
  group: checks-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  # Standard runners have 4 vCPUs (3 on macOS arm64); check.py would otherwise
  # apply its shared-machine default of 2.
  CARGO_BUILD_JOBS: 4
  RUST_TEST_THREADS: 4
  # Panics keep file and line numbers; full debug info mostly costs link time
  # and cache size, especially on Windows.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: rust-lld.exe

jobs:
  # Pull requests run only the checks for the areas they change; pushes and
  # manual runs check everything, since publication waits for main's full run.
  changes:
    name: Changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sim: ${{ steps.diff.outputs.sim }}
      client: ${{ steps.diff.outputs.client }}
      e2e: ${{ steps.diff.outputs.e2e }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "sim=true" >> "$GITHUB_OUTPUT"
            echo "client=true" >> "$GITHUB_OUTPUT"
            echo "e2e=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The checked-out merge commit's first parent is the base branch head.
          files=$(git diff --name-only HEAD^1 HEAD)
          # client.yml is the client's own reusable workflow; it runs no sim job.
          echo "sim=$(grep -qvE '^(client/|\.github/workflows/client\.yml$)' <<<"$files" && echo true || echo false)" >> "$GITHUB_OUTPUT"
          # The shared reader affects both consumers, including crate-only edits.
          echo "client=$(grep -qE '^(client/|crates/slither-protocol/|\.github/workflows/client\.yml$|\.gitattributes$|Cargo\.(toml|lock)$)' <<<"$files" && echo true || echo false)" >> "$GITHUB_OUTPUT"
          # Host or client code, the manifests and lock, or this workflow.
          echo "e2e=$(grep -qE '^(src/|crates/slither-protocol/|Cargo\.(toml|lock)$|client/(src/|apps/wgpu-slice/|tools/e2e-local-host|Cargo\.|rust-toolchain)|\.github/workflows/checks\.yml$)' <<<"$files" && echo true || echo false)" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint (ubuntu-latest)
    needs: changes
    if: needs.changes.outputs.sim == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: python3 tools/check.py lint wasm package

  test:
    name: Rust (${{ matrix.os }}, ${{ matrix.toolchain }})
    needs: changes
    if: needs.changes.outputs.sim == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            toolchain: stable
          - os: windows-latest
            toolchain: stable
          - os: macos-latest
            toolchain: stable
          - os: ubuntu-latest
            toolchain: '1.99.0'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run python tools/check.py test
        # Windows runners have no `cc` for the C header layout check.
        env:
          SLITHER_SIM_REQUIRE_CC: ${{ runner.os != 'Windows' && '1' || '' }}
        run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} tools/check.py test

  tools:
    name: Tools (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.sim == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.8.6'
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --locked --only-group tools
      - run: uv run --locked --only-group tools python tools/check.py tools

  client:
    name: Client
    needs: changes
    if: needs.changes.outputs.client == 'true'
    uses: ./.github/workflows/client.yml

  # The production client plays a short session against a local
  # `slither-sim host`, so a protocol break in either lane fails here. The runner
  # binds 127.0.0.1 only and never contacts outside servers.
  e2e:
    name: Host/client end to end
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      # client/rust-toolchain.toml selects this toolchain for the client build.
      - run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v0-e2e
          workspaces: |
            . -> target
            client/apps/wgpu-slice -> ../../target/wgpu-slice-e2e
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # The headless client prepares text with the DejaVu faces.
      - run: test -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf || { sudo apt-get update && sudo apt-get install -y fonts-dejavu-core; }
      - run: cargo build --release --locked
      - name: Build the headless client
        working-directory: client
        env:
          CARGO_PROFILE_DEV_DEBUG: 0
        run: cargo build --manifest-path apps/wgpu-slice/Cargo.toml --locked --bin slither-client-e2e --target-dir target/wgpu-slice-e2e
      - run: node client/tools/e2e-local-host.mjs --host-bin target/release/slither-sim --client-bin client/target/wgpu-slice-e2e/debug/slither-client-e2e

  # Content rules (no official client artifacts, keys or source maps) cover the
  # whole repository, so this runs on every change.
  guard:
    name: Repository guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node client/tools/check-repository.mjs

  required:
    name: Required checks
    if: always()
    needs: [changes, lint, test, tools, client, e2e, guard]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every needed job to succeed
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          GUARD_RESULT: ${{ needs.guard.result }}
          SIM: ${{ needs.changes.outputs.sim }}
          CLIENT: ${{ needs.changes.outputs.client }}
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
          TOOLS_RESULT: ${{ needs.tools.result }}
          CLIENT_RESULT: ${{ needs.client.result }}
          E2E: ${{ needs.changes.outputs.e2e }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          # A job may be skipped only when its area is unchanged.
          ok() { [ "$1" = success ] || { [ "$1" = skipped ] && [ "$2" = false ]; }; }
          test "$CHANGES_RESULT" = success && test "$GUARD_RESULT" = success &&
            ok "$LINT_RESULT" "$SIM" && ok "$TEST_RESULT" "$SIM" && ok "$TOOLS_RESULT" "$SIM" &&
            ok "$CLIENT_RESULT" "$CLIENT" && ok "$E2E_RESULT" "$E2E"
