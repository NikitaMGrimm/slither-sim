name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      approve_release_ci:
        type: boolean
        default: false
        description: 'Bounded release CI integration probe'

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: 2
  RUST_TEST_THREADS: 2

jobs:
  release-ci-probe:
    if: github.event_name == 'workflow_dispatch' && inputs.approve_release_ci
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Test approval of the known same-repository release bot run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api repos/$GH_REPO/actions/runs/39981290832 --jq '{event,conclusion,head_sha,pull_requests:[.pull_requests[].number]}'
          gh api --method POST repos/$GH_REPO/actions/runs/39981290832/approve
  rust:
    if: ${{ !inputs.approve_release_ci }}
    name: Rust (${{ matrix.os }}, ${{ matrix.toolchain }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            toolchain: stable
          - os: windows-latest
            toolchain: stable
          - os: ubuntu-latest
            toolchain: '1.86.0'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - run: python tools/check.py rust
      - if: matrix.os == 'ubuntu-latest' && matrix.toolchain == 'stable'
        run: python tools/check.py wasm package

  tools:
    if: ${{ !inputs.approve_release_ci }}
    name: Tools (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.8.6'
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --locked --only-group tools
      - run: uv run --locked --only-group tools python tools/check.py tools

  required:
    name: Required checks
    if: always() && !inputs.approve_release_ci
    needs: [rust, tools]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every test job to succeed
        env:
          RUST_RESULT: ${{ needs.rust.result }}
          TOOLS_RESULT: ${{ needs.tools.result }}
        run: test "$RUST_RESULT" = success && test "$TOOLS_RESULT" = success
