name: Checks

on: [workflow_dispatch]

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            toolchain: stable
            executable: slither-sim
          - os: windows-latest
            toolchain: stable
            executable: slither-sim.exe
          - os: ubuntu-latest
            toolchain: '1.86.0'
            executable: slither-sim
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo test --all-targets --locked
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo run --locked --example basic
      - run: cargo build --locked
      - run: python examples/bot.py --binary target/debug/${{ matrix.executable }} --steps 10
      - run: python tools/verify_extraction.py

  evidence-tools:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.8.6'
          python-version: '3.12'
      - run: uv sync --locked --only-group tools
      - run: uv run --locked --only-group tools python -m unittest discover -s tools/fidelity -p 'test_*.py'
      - run: uv run --locked --only-group tools node --test tools/fidelity/*.test.mjs
      - run: cargo build --locked
      - run: uv run --locked --only-group tools node examples/bot.mjs target/debug/slither-sim${{ runner.os == 'Windows' && '.exe' || '' }} 10
      - run: uv run --locked --only-group tools python tools/verify_extraction.py
