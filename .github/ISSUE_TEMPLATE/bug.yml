name: Bug report
description: Report a reproducible simulator, bot interface or tooling problem.
title: "bug: "
body:
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the command, seed and relevant configuration. Keep credentials and full recordings out of the issue.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Include the error or a short output excerpt, if relevant.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Version and environment
      description: Commit or version, operating system, and Rust, Python or Node.js version as applicable.
    validations:
      required: true
