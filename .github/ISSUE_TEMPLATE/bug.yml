name: Bug report
description: Report a reproducible simulator, bot interface or tooling problem.
title: "bug: "
body:
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Command, seed and relevant configuration; exclude credentials and full recordings.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Include relevant errors or a short output excerpt.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Version and environment
      description: Commit/version, operating system and applicable Rust, Python or Node.js version.
    validations:
      required: true
